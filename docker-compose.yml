version: '3.8'

services:
  # ─── Hub (FastAPI + Ollama) ───
  hub:
    build:
      context: ./hub
      dockerfile: Dockerfile
    container_name: pathfinder-hub
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PFGOD_DATA_DIR=/data
    volumes:
      - ./data:/data
      - ./hub/.env:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ─── Ollama (Local LLM) ───
  ollama:
    image: ollama/ollama:latest
    container_name: pathfinder-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ─── Spoke (APK Server) ───
  spoke:
    build:
      context: ./spoke
      dockerfile: Dockerfile
    container_name: pathfinder-spoke
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  ollama_data: