# OpenAPI Generator Configuration for Pathfinder God
# Run: dart run build_runner build --delete-conflicting-outputs
# Or: dart run openapi_generator:generate

output_dir: lib/api
input_spec: ../shared/openapi.yaml

generator: dart

options:
  # Generate models
  generateModels: true
  # Generate enums from string enums
  generateEnums: true
  # Generate copyWith methods
  generateCopyWith: true
  # Generate toJson/fromJson
  generateToJson: true
  generateFromJson: true
  # Null safety
  nullSafe: true
  # Generate equality operators
  generateEquality: true
  # Use Freezed (optional - requires freezed package)
  # useFreezed: false
  # Add @freezed annotation if useFreezed: true
  # addDefaultValues: true
  # Generate fromJson factory constructors
  # Generate toJson methods
  # Use required for non-nullable fields
  requiredFields: true
  # Generate default values for optional fields
  # defaultValues: false
  # Use sealed classes for unions
  # sealedClasses: false
  # DateTime format
  # dateTimeFormat: iso8601
  # Use Int64 for int64
  # useInt64: true