  /rules/search:
    get:
      tags:
      - rules
      summary: Search Rules
      operationId: search_rules_rules_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Search query
          title: Q
        description: Search query
      - name: edition
        in: query
        required: false
        schema:
          enum:
          - 1e
          - 2e
          - both
          type: string
          description: 'Edition: 1e, 2e, or both'
          default: both
          title: Edition
        description: 'Edition: 1e, 2e, or both'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
          title: Limit
      responses:
