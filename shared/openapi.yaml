components:
  schemas:
    AskRequest:
      properties:
        edition:
          default: both
          enum:
          - 1e
          - 2e
          - both
          title: Edition
          type: string
        history:
          description: Recent (speaker, message) turns for continuity, e.g. ('user',
            '...').
          items:
            maxItems: 2
            minItems: 2
            prefixItems:
            - type: string
            - type: string
            type: array
          title: History
          type: array
        mode:
          anyOf:
          - enum:
            - character
            - npc
            - monster
            - boss
            - map
            - campaign
            - encounter
            type: string
          - type: 'null'
          description: Force a generation mode; omit to auto-detect.
          title: Mode
        query:
          description: The GM question or free-form request.
          title: Query
          type: string
      required:
      - query
      title: AskRequest
      type: object
    AskResponse:
      properties:
        answer:
          title: Answer
          type: string
        backend:
          enum:
          - ollama
          - raw-excerpts
          title: Backend
          type: string
        edition:
          title: Edition
          type: string
        mode:
          title: Mode
          type: string
        sources:
          items:
            $ref: '#/components/schemas/RuleHit'
          title: Sources
          type: array
      required:
      - answer
      - backend
      - mode
      - edition
      title: AskResponse
      type: object
    CampaignNote:
      properties:
        prompt:
          title: Prompt
          type: string
        response:
          title: Response
          type: string
      required:
      - prompt
      - response
      title: CampaignNote
      type: object
    CampaignState:
      properties:
        notes:
          items:
            $ref: '#/components/schemas/CampaignNote'
          title: Notes
          type: array
        party:
          items:
            additionalProperties: true
            type: object
          title: Party
          type: array
      title: CampaignState
      type: object
    GenerateRequest:
      properties:
        edition:
          default: both
          enum:
          - 1e
          - 2e
          - both
          title: Edition
          type: string
        prompt:
          description: What to create, e.g. 'a cunning goblin alchemist boss'.
          title: Prompt
          type: string
      required:
      - prompt
      title: GenerateRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HubHealth:
      properties:
        databases_found:
          items:
            type: string
          title: Databases Found
          type: array
        ollama_model:
          title: Ollama Model
          type: string
        status:
          const: ok
          default: ok
          title: Status
          type: string
        version:
          title: Version
          type: string
      required:
      - version
      - ollama_model
      title: HubHealth
      type: object
    RuleHit:
      properties:
        category:
          default: ''
          title: Category
          type: string
        content:
          title: Content
          type: string
        name:
          title: Name
          type: string
        source_book:
          default: ''
          title: Source Book
          type: string
        system:
          default: ''
          title: System
          type: string
      required:
      - name
      - content
      title: RuleHit
      type: object
    RulesSearchResponse:
      properties:
        edition:
          title: Edition
          type: string
        query:
          title: Query
          type: string
        results:
          items:
            $ref: '#/components/schemas/RuleHit'
          title: Results
          type: array
      required:
      - query
      - edition
      - results
      title: RulesSearchResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  summary: A local Pathfinder GM (RAG + Ollama) served to the companion app.
  title: Pathfinder God Hub
  version: 0.1.0
openapi: 3.1.0
paths:
  /ask:
    post:
      description: General GM Q&A / generation (auto-detects mode unless one is given).
      operationId: ask_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ask
      tags:
      - gm
  /campaign:
    get:
      operationId: campaign_get_campaign_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignState'
          description: Successful Response
      summary: Campaign Get
      tags:
      - campaign
  /campaign/note:
    post:
      operationId: campaign_add_note_campaign_note_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignNote'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignState'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Campaign Add Note
      tags:
      - campaign
  /campaign/reset:
    post:
      operationId: campaign_reset_campaign_reset_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignState'
          description: Successful Response
      summary: Campaign Reset
      tags:
      - campaign
  /generate/{kind}:
    post:
      description: "Typed generators \xE2\u20AC\u201D the God's core creative powers.\n\
        \n``kind`` is one of: character, npc, monster, boss, map, campaign, encounter.\n\
        Each forces the matching mode so you always get full bios/backstories.\nUnknown\
        \ kinds fall back to auto-detection from the raw prompt."
      operationId: generate_generate__kind__post
      parameters:
      - in: path
        name: kind
        required: true
        schema:
          title: Kind
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Generate
      tags:
      - gm
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubHealth'
          description: Successful Response
      summary: Health
      tags:
      - meta
  /rules/search:
    get:
      description: "Raw rule/bestiary lookup (no LLM) \xE2\u20AC\u201D powers the\
        \ app's rules browser."
      operationId: rules_search_rules_search_get
      parameters:
      - in: query
        name: q
        required: true
        schema:
          title: Q
          type: string
      - in: query
        name: edition
        required: false
        schema:
          default: both
          title: Edition
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 5
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesSearchResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rules Search
      tags:
      - rules
