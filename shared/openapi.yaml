openapi: 3.1.0
info:
  title: Pathfinder God Hub
  description: A local Pathfinder GM (RAG + Ollama) served to the companion app.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - monitoring
      - monitoring
      summary: Health
      description: 'Basic liveness probe - indicates the service is running.

        Does NOT check dependencies.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ask:
    post:
      tags:
      - gm
      summary: Ask Endpoint
      operationId: ask_endpoint_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /generate/{kind}:
    post:
      tags:
      - gm
      summary: Generate Endpoint
      operationId: generate_endpoint_generate__kind__post
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          description: Generator kind
          title: Kind
        description: Generator kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /rules/search:
    get:
      tags:
      - rules
      summary: Search Rules
      operationId: search_rules_rules_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          description: Search query
          title: Q
        description: Search query
      - name: edition
        in: query
        required: false
        schema:
          type: string
          description: 'Edition: 1e, 2e, or both'
          default: both
          title: Edition
        description: 'Edition: 1e, 2e, or both'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /rules/fetch:
    post:
      tags:
      - rules
      summary: Fetch Missing Rule
      description: 'On-demand scrape: fetch one missing term into the DB, permanently.


        1e terms are scraped live (AoN 1e search, PRD spell fallback). Anything

        else is queued to data/misses.jsonl for the chunked fleet backfill.'
      operationId: fetch_missing_rule_rules_fetch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleHit'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /rules/missed:
    post:
      tags:
      - rules
      summary: Report Missed
      description: Drain a Spoke offline miss queue into data/misses.jsonl.
      operationId: report_missed_rules_missed_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissedBatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Report Missed Rules Missed Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - rules
      summary: List Missed
      description: Queued misses, oldest first — feed for chunked backfill runs.
      operationId: list_missed_rules_missed_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Missed Rules Missed Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign:
    get:
      tags:
      - campaign
      summary: Get Campaign
      description: Get current campaign state (party + session notes).
      operationId: get_campaign_campaign_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/note:
    post:
      tags:
      - campaign
      summary: Add Campaign Note
      description: 'Add a note to the campaign log.

        Triggers Continuity Keeper in background to extract entities and summarize.'
      operationId: add_campaign_note_campaign_note_post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignNote'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/reset:
    post:
      tags:
      - campaign
      summary: Reset Campaign
      description: Reset campaign to empty state.
      operationId: reset_campaign_campaign_reset_post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/export:
    get:
      tags:
      - campaign
      - campaign
      - export
      summary: Export Campaign
      description: Export complete campaign data for backup or transfer.
      operationId: export_campaign_campaign_export_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignExport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/import:
    post:
      tags:
      - campaign
      - campaign
      - import
      summary: Import Campaign
      description: Import campaign data from backup. Use replace_existing=true to
        overwrite.
      operationId: import_campaign_campaign_import_post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignImport'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/backup:
    get:
      tags:
      - campaign
      - campaign
      - export
      summary: Download Backup
      description: Download campaign backup as JSON file.
      operationId: download_backup_campaign_backup_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/npcs:
    get:
      tags:
      - campaign
      summary: List Npcs
      operationId: list_npcs_campaign_npcs_get
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Npcs Campaign Npcs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - campaign
      summary: Create Npc
      operationId: create_npc_campaign_npcs_post
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NPCRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Npc Campaign Npcs Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /campaign/party:
    get:
      tags:
      - campaign
      summary: List Party
      operationId: list_party_campaign_party_get
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Party Campaign Party Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - campaign
      summary: Add Party Member
      operationId: add_party_member_campaign_party_post
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Campaign Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyMemberRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Add Party Member Campaign Party Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ready:
    get:
      tags:
      - monitoring
      - monitoring
      summary: Readiness
      description: 'Readiness probe - checks if service can handle requests.

        Verifies all critical dependencies.'
      operationId: readiness_ready_get
      parameters:
      - name: data_dir
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Data Dir
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health/detailed:
    get:
      tags:
      - monitoring
      - monitoring
      summary: Detailed Health
      description: Detailed health check with system info and dependency status.
      operationId: detailed_health_health_detailed_get
      parameters:
      - name: data_dir
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Data Dir
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedHealthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /metrics:
    get:
      tags:
      - monitoring
      - monitoring
      summary: Metrics
      description: Prometheus-compatible metrics endpoint.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /metrics/json:
    get:
      tags:
      - monitoring
      - monitoring
      summary: Metrics Json
      description: JSON format metrics for programmatic consumption.
      operationId: metrics_json_metrics_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
  /version:
    get:
      tags:
      - monitoring
      - monitoring
      summary: Version
      description: Version information.
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AskRequest:
      properties:
        query:
          type: string
          title: Query
        edition:
          type: string
          title: Edition
          default: both
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
        history:
          items:
            items:
              type: string
            type: array
          type: array
          title: History
          default: []
      type: object
      required:
      - query
      title: AskRequest
    AskResponse:
      properties:
        answer:
          type: string
          title: Answer
        backend:
          type: string
          title: Backend
        mode:
          type: string
          title: Mode
        edition:
          type: string
          title: Edition
        sources:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Sources
      type: object
      required:
      - answer
      - backend
      - mode
      - edition
      - sources
      title: AskResponse
    CampaignExport:
      properties:
        campaign:
          additionalProperties: true
          type: object
          title: Campaign
        party:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Party
        npcs:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Npcs
        locations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Locations
        items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Items
        quests:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Quests
        sessions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Sessions
        party_members:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Party Members
        notes:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Notes
        decisions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Decisions
        exported_at:
          type: string
          title: Exported At
        version:
          type: string
          title: Version
      type: object
      required:
      - campaign
      - party
      - npcs
      - locations
      - items
      - quests
      - sessions
      - party_members
      - notes
      - decisions
      - exported_at
      - version
      title: CampaignExport
      description: Complete campaign export for backup/transfer.
    CampaignImport:
      properties:
        campaign:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Campaign
        party:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Party
        npcs:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Npcs
        locations:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Locations
        items:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Items
        quests:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Quests
        party_members:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Party Members
        replace_existing:
          type: boolean
          title: Replace Existing
          default: true
      type: object
      title: CampaignImport
    CampaignNote:
      properties:
        prompt:
          type: string
          title: Prompt
        response:
          type: string
          title: Response
      type: object
      required:
      - prompt
      - response
      title: CampaignNote
    CampaignStateResponse:
      properties:
        party:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Party
        notes:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Notes
      type: object
      required:
      - party
      - notes
      title: CampaignStateResponse
    DetailedHealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        environment:
          type: string
          title: Environment
        ollama_model:
          type: string
          title: Ollama Model
        databases_found:
          items:
            type: string
          type: array
          title: Databases Found
        timestamp:
          type: string
          title: Timestamp
        uptime_seconds:
          type: number
          title: Uptime Seconds
        system:
          additionalProperties: true
          type: object
          title: System
        database:
          additionalProperties: true
          type: object
          title: Database
        ollama:
          additionalProperties: true
          type: object
          title: Ollama
        checks:
          additionalProperties:
            type: string
          type: object
          title: Checks
      type: object
      required:
      - status
      - version
      - environment
      - ollama_model
      - databases_found
      - timestamp
      - uptime_seconds
      - system
      - database
      - ollama
      - checks
      title: DetailedHealthResponse
    FetchRequest:
      properties:
        q:
          type: string
          title: Q
        edition:
          type: string
          title: Edition
          default: both
      type: object
      required:
      - q
      title: FetchRequest
    GenerateRequest:
      properties:
        prompt:
          type: string
          title: Prompt
        edition:
          type: string
          title: Edition
          default: both
      type: object
      required:
      - prompt
      title: GenerateRequest
    GenerateResponse:
      properties:
        answer:
          type: string
          title: Answer
        backend:
          type: string
          title: Backend
        mode:
          type: string
          title: Mode
        edition:
          type: string
          title: Edition
        sources:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Sources
      type: object
      required:
      - answer
      - backend
      - mode
      - edition
      - sources
      title: GenerateResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        ollama_model:
          type: string
          title: Ollama Model
        databases_found:
          items:
            type: string
          type: array
          title: Databases Found
        timestamp:
          type: string
          title: Timestamp
        uptime_seconds:
          type: number
          title: Uptime Seconds
      type: object
      required:
      - status
      - version
      - ollama_model
      - databases_found
      - timestamp
      - uptime_seconds
      title: HealthResponse
    MetricsResponse:
      properties:
        requests_total:
          type: integer
          title: Requests Total
        requests_per_second:
          type: number
          title: Requests Per Second
        average_response_time_ms:
          type: number
          title: Average Response Time Ms
        error_rate:
          type: number
          title: Error Rate
        uptime_seconds:
          type: number
          title: Uptime Seconds
        memory_usage_mb:
          type: number
          title: Memory Usage Mb
        cpu_percent:
          type: number
          title: Cpu Percent
        disk_usage_percent:
          type: number
          title: Disk Usage Percent
        active_connections:
          type: integer
          title: Active Connections
      type: object
      required:
      - requests_total
      - requests_per_second
      - average_response_time_ms
      - error_rate
      - uptime_seconds
      - memory_usage_mb
      - cpu_percent
      - disk_usage_percent
      - active_connections
      title: MetricsResponse
    MissedBatch:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/MissedQuery'
          type: array
          title: Queries
      type: object
      required:
      - queries
      title: MissedBatch
    MissedQuery:
      properties:
        q:
          type: string
          title: Q
        edition:
          type: string
          title: Edition
          default: both
      type: object
      required:
      - q
      title: MissedQuery
    NPCRequest:
      properties:
        name:
          type: string
          title: Name
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        role:
          type: string
          title: Role
          default: unknown
        level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Level
        ancestry:
          anyOf:
          - type: string
          - type: 'null'
          title: Ancestry
        class:
          anyOf:
          - type: string
          - type: 'null'
          title: Class
        disposition:
          type: string
          title: Disposition
          default: unknown
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - name
      title: NPCRequest
    PartyMemberRequest:
      properties:
        name:
          type: string
          title: Name
        player_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Player Name
        class:
          anyOf:
          - type: string
          - type: 'null'
          title: Class
        level:
          type: integer
          title: Level
          default: 1
        ancestry:
          anyOf:
          - type: string
          - type: 'null'
          title: Ancestry
        background:
          anyOf:
          - type: string
          - type: 'null'
          title: Background
        stats:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Stats
      type: object
      required:
      - name
      title: PartyMemberRequest
    ReadinessResponse:
      properties:
        status:
