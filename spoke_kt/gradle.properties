org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.0.1 predates compileSdk 37 and emits "We recommend using a newer Android Gradle
# plugin to use compile SDK version 37.0" on every build. compileSdk 37 is pinned by
# libs.versions.toml, and RULES.md 5.4 forbids bumping AGP without a blueprint gate, so
# the advisory is acknowledged rather than silenced at the source. The pairing is
# verified green: assembleDebug, 97 unit tests and 37 instrumented tests all pass.
# AGP itself prescribes the value below (it prints it with the warning); both spellings
# are required because AGP normalises compileSdk "37" to the 37.0 float.
android.suppressUnsupportedCompileSdk=37,37.0
